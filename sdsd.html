<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      padding: 24px;
    }

    .profile-card {
      width: 100%;
      max-width: 380px;
      background-color: #ffffff;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 45px rgba(24, 16, 48, 0.25);
      text-align: center;
    }

    .avatar-placeholder {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background-color: #d8dce3;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 14px;
      font-weight: 500;
      border: 4px solid #f3f4f6;
    }

    .name {
      font-size: 28px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 10px;
      cursor: pointer;
      display: inline-block;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    .name:hover {
      color: #764ba2;
      transform: translateY(-1px);
    }

    .bio {
      font-size: 15px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 28px;
    }

    .favorites-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    .favorites-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .favorites-list li {
      background-color: #f9fafb;
      border: 1px solid #eef0f3;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 15px;
      color: #374151;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .favorites-list .emoji {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="avatar-placeholder" aria-label="프로필 이미지 영역">사진</div>

    <h1 class="name">김민지</h1>
    <p class="bio">작은 아이디어와 깔끔한 화면을 만드는 것을 좋아하는 창작자입니다.</p>

    <p class="favorites-title">좋아하는 것</p>
    <ul class="favorites-list">
      <li><span class="emoji" aria-hidden="true">☕</span><span>아침에 마시는 따뜻한 커피</span></li>
      <li><span class="emoji" aria-hidden="true">🎧</span><span>조용한 밤에 듣는 로파이 음악</span></li>
      <li><span class="emoji" aria-hidden="true">📚</span><span>주말 오후의 산책과 독서</span></li>
    </ul>
  </main>
</body>
</html>
